plugins {
    id "com.android.application"
}

android {
    namespace "com.themidastouche.stocknestio"
    compileSdk 36

    defaultConfig {
        applicationId "com.themidastouche.stocknestio"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
